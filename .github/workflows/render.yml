name: Render era layers
# Renders an era's pre-rendered depth layers with Blender (Cycles, CPU) and
# commits them to assets/eras/<era>/. A push to tools/blender/ makes a quick
# draft render; run it manually for full quality.
on:
  push:
    branches: [main]
    paths: ['tools/blender/**']
  workflow_dispatch:
    inputs:
      era: { description: 'Era to render', default: 'rome' }
      res: { description: 'Panorama width in pixels', default: '3072' }
      samples: { description: 'Cycles samples per pixel', default: '128' }
permissions:
  contents: write
  actions: write
concurrency:
  group: render
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      ERA: ${{ inputs.era || 'rome' }}
      RES: ${{ inputs.res || '1024' }}
      SAMPLES: ${{ inputs.samples || '24' }}
      BLENDER: blender-4.2.3-linux-x64
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libxkbcommon0 libsm6 libice6 libegl1 > /dev/null
          curl -sSL -o blender.tar.xz https://download.blender.org/release/Blender4.2/$BLENDER.tar.xz
          tar xf blender.tar.xz
          ./$BLENDER/blender --version | head -1
      - name: Fetch CC0 textures (Poly Haven)
        run: python3 tools/blender/fetch_textures.py 2k
      - name: Render
        run: |
          set -o pipefail
          mkdir -p ci-logs
          ./$BLENDER/blender -b --factory-startup --python-exit-code 1 --python tools/blender/render_era.py -- \
            --era "$ERA" --out "assets/eras/$ERA" --res "$RES" --samples "$SAMPLES" 2>&1 | tee ci-logs/render.log
      - name: Commit layers and log
        if: always()
        run: |
          # stash results outside the checkout, reset to the latest main, then copy back:
          # nothing a concurrent push changed can conflict with this commit
          mkdir -p /tmp/out ci-logs
          { echo "run: ${{ github.run_id }}  era=$ERA res=$RES samples=$SAMPLES  status=${{ job.status }}"; tail -n 400 ci-logs/render.log 2>/dev/null; } > /tmp/out/render-$ERA.log
          [ -f "assets/eras/$ERA/manifest.json" ] && cp -r "assets/eras/$ERA" /tmp/out/layers
          git config user.name "magic-window-render"
          git config user.email "render@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            mkdir -p ci-logs && cp /tmp/out/render-$ERA.log ci-logs/
            git add "ci-logs/render-$ERA.log"
            if [ -d /tmp/out/layers ]; then rm -rf "assets/eras/$ERA"; mkdir -p assets/eras; cp -r /tmp/out/layers "assets/eras/$ERA"; git add -A "assets/eras/$ERA"; fi
            git commit -q -m "Render $ERA layers (${RES}px, ${SAMPLES} spp) [run ${{ github.run_id }}]" || exit 0
            git push -q origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
      - name: Redeploy the site
        # pushes made with the workflow token don't trigger other workflows, so start the deploy explicitly
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
