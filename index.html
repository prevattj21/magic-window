<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Magic Window</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#14110d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Cormorant+Garamond:wght@500;600&family=Figtree:wght@400;500;600&display=swap">
<style>
  /* Layout: a full-bleed 3D stage with a museum-placard overlay. Top bar for identity,
     bottom dock for choosing an era and entering AR. One deliberate dark look. */
  :root {
    --ink: #f3ece0;          /* placard text */
    --ink-dim: #b9ad9b;
    --glass: rgba(22, 18, 14, 0.72);
    --glass-edge: rgba(214, 186, 128, 0.28);
    --brass: #d2ad62;        /* accent: aged brass of the plaques */
    --brass-ink: #1b150d;
    --ground: #14110d;
    --danger: #e0806a;
    --display: "Marcellus", "Trajan Pro", Georgia, serif;
    --serif: "Cormorant Garamond", Georgia, serif;
    --body: "Figtree", system-ui, -apple-system, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: var(--ground); color: var(--ink); font-family: var(--body); overflow: hidden; -webkit-tap-highlight-color: transparent; }
  body.ar { background: transparent; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; touch-action: none; }
  #ui { position: fixed; inset: 0; pointer-events: none; }
  #ui > * { pointer-events: auto; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

  .topbar { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding-top: calc(12px + env(safe-area-inset-top, 0px)); padding-bottom: 12px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: linear-gradient(to bottom, rgba(10, 8, 6, 0.55), transparent); pointer-events: none; }
  .topbar > * { pointer-events: auto; }
  .mark { font-family: var(--display); font-size: 1.05rem; letter-spacing: 0.32em; text-transform: uppercase; display: flex; align-items: center; gap: 10px; text-shadow: 0 1px 8px rgba(0,0,0,0.5); }
  .mark i { width: 14px; height: 20px; border: 1.5px solid var(--brass); border-radius: 7px 7px 1px 1px; display: inline-block; }
  .tools { display: flex; gap: 8px; }
  .chip { background: var(--glass); border: 1px solid var(--glass-edge); border-radius: 999px; padding: 7px 14px; font-size: 0.8rem; font-weight: 500; letter-spacing: 0.04em; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .chip:disabled { opacity: 0.4; cursor: default; }
  #btn-exit { display: none; }
  body.ar #btn-exit { display: inline-block; }
  body.ar #btn-quality { display: none; }

  .dock { position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; gap: 10px;
    padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); padding-top: 28px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: linear-gradient(to top, rgba(10, 8, 6, 0.6), transparent); pointer-events: none; }
  .dock > * { pointer-events: auto; }
  #hint { font-size: 0.82rem; color: var(--ink); background: rgba(10, 8, 6, 0.5); padding: 5px 12px; border-radius: 999px; text-align: center; max-width: 100%; }
  .dock-row { display: flex; gap: 10px; align-items: stretch; flex-wrap: wrap; justify-content: center; max-width: 100%; }
  #eras { display: flex; gap: 6px; background: var(--glass); border: 1px solid var(--glass-edge); border-radius: 14px; padding: 5px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); min-width: 0; }
  .era { display: flex; align-items: center; gap: 9px; background: transparent; border: 1px solid transparent; border-radius: 10px; padding: 7px 12px 7px 8px; text-align: left; min-width: 0; }
  .era.on { background: rgba(210, 173, 98, 0.16); border-color: var(--brass); }
  .era-text { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
  .era-text b { font-family: var(--serif); font-size: 1.05rem; font-weight: 600; white-space: nowrap; }
  .era-text small { font-size: 0.72rem; color: var(--ink-dim); letter-spacing: 0.08em; font-variant-numeric: tabular-nums; }
  .era-swatch { width: 26px; height: 34px; border-radius: 13px 13px 2px 2px; flex: none; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,0.25); }
  .era-rome { background: linear-gradient(#5d8fd2, #f0dcb8 60%, #d9c39a); }
  .era-byz { background: linear-gradient(#7ea8d6, #f4d6ad 55%, #2f6c85 56%); }
  .era-ny { background: linear-gradient(#1c2a55, #f09a5e 70%, #3a3340); border-radius: 2px; }
  #btn-ar { background: var(--brass); color: var(--brass-ink); border: none; border-radius: 14px; padding: 0 20px; font-weight: 600; letter-spacing: 0.04em; min-height: 54px; display: flex; align-items: center; gap: 8px; }
  #btn-ar.muted { background: rgba(210, 173, 98, 0.22); color: var(--ink); border: 1px solid var(--brass); }
  body.ar #btn-ar { display: none; }

  #toast { position: absolute; top: calc(64px + env(safe-area-inset-top, 0px)); left: 50%; transform: translate(-50%, -8px); opacity: 0; transition: opacity .35s, transform .35s;
    width: min(380px, calc(100% - 32px)); background: var(--glass); border: 1px solid var(--glass-edge); border-radius: 12px; padding: 12px 16px; pointer-events: none; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #toast b { font-family: var(--display); letter-spacing: 0.12em; text-transform: uppercase; font-weight: 400; }
  #toast span { color: var(--brass); font-size: 0.85rem; margin-left: 6px; }
  #toast p { margin: 6px 0 0; font-size: 0.88rem; color: var(--ink-dim); line-height: 1.4; }

  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--ground); transition: opacity .6s; z-index: 5; }
  #loading.done { opacity: 0; pointer-events: none; }
  .load-inner { text-align: center; display: grid; gap: 14px; justify-items: center; padding: 0 16px; }
  .load-arch { width: 54px; height: 76px; border: 2px solid var(--brass); border-radius: 27px 27px 3px 3px; position: relative; overflow: hidden; }
  .load-arch::after { content: ""; position: absolute; inset: 0; background: linear-gradient(transparent, rgba(210,173,98,0.5), transparent); animation: sweep 1.6s ease-in-out infinite; }
  @keyframes sweep { from { transform: translateY(-100%); } to { transform: translateY(100%); } }
  .load-title { font-family: var(--display); letter-spacing: 0.4em; text-transform: uppercase; font-size: 1.4rem; }
  #loading-status { color: var(--ink-dim); font-size: 0.9rem; }

  #modal { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(8, 6, 4, 0.6); z-index: 6; padding: 16px; }
  .modal-card { width: min(420px, 100%); background: #1d1812; border: 1px solid var(--glass-edge); border-radius: 16px; padding: 22px; }
  .modal-body h2 { font-family: var(--display); font-weight: 400; letter-spacing: 0.08em; margin: 0 0 10px; font-size: 1.3rem; text-wrap: balance; }
  .modal-body p { color: var(--ink-dim); line-height: 1.5; margin: 0 0 10px; }
  .modal-body b { color: var(--ink); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  .modal-actions button { background: transparent; border: 1px solid var(--glass-edge); border-radius: 10px; padding: 9px 16px; }
  .modal-actions button.primary { background: var(--brass); color: var(--brass-ink); border-color: var(--brass); font-weight: 600; }

  #error { position: fixed; left: 16px; right: 16px; bottom: calc(120px + env(safe-area-inset-bottom, 0px)); background: #3a1a14; color: #ffd9cf; border: 1px solid var(--danger); border-radius: 10px; padding: 10px 14px; font-size: 0.82rem; z-index: 7; }
  #fps { position: fixed; top: calc(60px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); font: 600 0.75rem ui-monospace, monospace; background: rgba(0,0,0,0.6); padding: 3px 8px; border-radius: 6px; }

  @media (max-width: 560px) {
    .era { padding: 6px 8px 6px 6px; gap: 6px; }
    .era-swatch { width: 18px; height: 26px; }
    .era-text b { font-size: 0.92rem; }
    #btn-ar { min-height: 46px; padding: 0 16px; }
    .mark { font-size: 0.9rem; letter-spacing: 0.24em; }
  }
  @media (max-width: 400px) { .era-text b { font-size: 0.84rem; } .era-text small { font-size: 0.66rem; } }
  @media (prefers-reduced-motion: reduce) { .load-arch::after { animation: none; } #toast { transition: none; } }
</style>
</head>
<body>

<div id="stage"></div>

<div id="ui">
  <header class="topbar ui-block">
    <div class="mark"><i aria-hidden="true"></i>Magic Window</div>
    <div class="tools">
      <button class="chip" id="btn-quality" title="Switch between full and reduced resolution">HD</button>
      <button class="chip" id="btn-reset">Reset</button>
      <button class="chip" id="btn-exit">Exit AR</button>
    </div>
  </header>

  <div id="toast" role="status" aria-live="polite"></div>

  <footer class="dock">
    <div id="hint">Loading…</div>
    <div class="dock-row ui-block">
      <div id="eras" role="group" aria-label="Choose an era"></div>
      <button id="btn-ar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><path d="M9 16v-5a3 3 0 0 1 6 0v5z"/></svg>View in AR</button>
    </div>
  </footer>

  <div id="modal" hidden class="ui-block"><div class="modal-card"><div class="modal-body"></div><div class="modal-actions"></div></div></div>
  <div id="error" hidden></div>
  <div id="fps" hidden></div>
</div>

<div id="loading">
  <div class="load-inner">
    <div class="load-arch" aria-hidden="true"></div>
    <div class="load-title">Magic Window</div>
    <div id="loading-status">Preparing…</div>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
